name: Temp Generate API

# Temporary helper: regenerates the HTTP API client and uploads it as an
# artifact, so the generated files can be taken verbatim instead of hand-written.
# Delete this workflow once the client is committed.

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    name: Generate API client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate the HTTP API client
        run: pnpm --dir apps/rgsm-gui web:generate-api

      - name: Upload the generated client
        uses: actions/upload-artifact@v7
        with:
          name: generated-api-client
          path: |
            apps/rgsm-gui/src/api/generated
            apps/rgsm-gui/src/api/defaultConfig.generated.ts
